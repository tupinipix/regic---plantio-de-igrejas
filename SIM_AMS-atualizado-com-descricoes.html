// ---- Glossário: motor da caixa de dica (hover no desktop, toque/clique no mobile) ----
// Um único elemento #gtermTip é reaproveitado para qualquer termo .gterm da tela — mais leve
// que criar um tooltip por ocorrência, e mais fácil de manter posicionado/fechado num app de
// uma página só (o conteúdo de #viewWrap é substituído inteiro a cada navegação).
let gtermPinned = false, gtermTarget = null, gtermHideTimer = null;
function hideGlossaryTip(){
  const tip = qs('#gtermTip'); if(!tip) return;
  tip.classList.remove('show');
  if(gtermTarget) gtermTarget.classList.remove('gt-active');
  gtermTarget = null; gtermPinned = false;
}
function positionGlossaryTip(target){
  const tip = qs('#gtermTip'); if(!tip) return;
  const r = target.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left, top = r.bottom + 8;
  if(left + tw > window.innerWidth - 10) left = window.innerWidth - tw - 10;
  if(left < 10) left = 10;
  if(top + th > window.innerHeight - 10) top = r.top - th - 8;
  if(top < 10) top = 10;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function showGlossaryTip(target){
  const key = target.getAttribute('data-g');
  const g = GLOSSARY[key];
  const tip = qs('#gtermTip'); if(!g || !tip) return;
  if(gtermTarget && gtermTarget !== target) gtermTarget.classList.remove('gt-active');
  gtermTarget = target;
  target.classList.add('gt-active');
  tip.innerHTML = `<div class="gt-term"><span>${esc(g.t)}</span><button class="gt-close" aria-label="Fechar" data-gt-close>${ICON.x}</button></div>${esc(g.d)}`;
  tip.classList.add('show');
  requestAnimationFrame(()=> positionGlossaryTip(target));
}
function initGlossaryTooltip(){
  document.addEventListener('mouseover', e=>{
    const t = e.target.closest('.gterm'); if(!t) return;
    clearTimeout(gtermHideTimer);
    showGlossaryTip(t);
  });
  document.addEventListener('mouseout', e=>{
    const t = e.target.closest('.gterm'); if(!t || gtermPinned) return;
    gtermHideTimer = setTimeout(()=>{ if(!gtermPinned) hideGlossaryTip(); }, 140);
  });
  document.addEventListener('focusin', e=>{
    const t = e.target.closest('.gterm'); if(t) showGlossaryTip(t);
  });
  document.addEventListener('focusout', e=>{
    const t = e.target.closest('.gterm'); if(t && !gtermPinned) hideGlossaryTip();
  });
  // Toque/clique: "fixa" a dica aberta (útil em telas sem hover) até um novo toque no mesmo
  // termo, num termo diferente, no botão de fechar, ou fora da caixa.
  document.addEventListener('click', e=>{
    const closeBtn = e.target.closest('[data-gt-close]');
    if(closeBtn){ hideGlossaryTip(); return; }
    const t = e.target.closest('.gterm');
    if(t){
      if(gtermPinned && gtermTarget === t){ hideGlossaryTip(); return; }
      gtermPinned = true; showGlossaryTip(t); return;
    }
    if(!e.target.closest('#gtermTip')) hideGlossaryTip();
  });
  window.addEventListener('scroll', ()=>{ if(gtermTarget) positionGlossaryTip(gtermTarget); }, true);
  window.addEventListener('resize', ()=>{ if(gtermTarget) positionGlossaryTip(gtermTarget); });
}
// A tabela de "Vazios" e a de "Polos" ordenam ao clicar no cabeçalho — sem esta guarda, um
// clique num termo .gterm dentro do <th> (para abrir a dica no toque) também dispararia a
// reordenação da tabela por baixo, como efeito colateral indesejado.
function isGtermClick(e){ return !!e.target.closest('.gterm'); }

try{
  buildSidebar();
  buildBottomNav();
  initGlossaryTooltip();
  render();
}catch(err){
  console.error('Falha na inicialização do SIM', err);
}

// The splash is hidden unconditionally — a failure in one view or in an external
// CDN library (map/charts) must never leave the user stuck on the loading screen.
setTimeout(()=>{
  const splash = qs('#splash'), root = qs('#appRoot');
  if(splash) splash.classList.add('hide');
  if(root) root.classList.add('ready');
  setTimeout(()=>{ if(splash) splash.remove(); }, 550);
}, 420);

/* ---------------------------------------------------------------------
   Atualização automática do IBGE — a cada acesso ao app (cada carregamento
   da página), busca dados populacionais atuais em segundo plano, sem
   exigir clique do usuário:
   · "Habitantes por adventista" (Início) — lote com os ~307 municípios do
     escopo AMS, disparado 1,5s após o carregamento (depois da renderização
     inicial, para não competir por rede/CPU com o primeiro paint).
   · Perfil de Município e Simulador já buscavam automaticamente ao abrir
     (loadMunicipioPopulacao / loadSimuladorPopulacao) — isso não muda.
   Se o usuário estiver numa tela diferente quando a resposta chegar,
   ibgeHabAdvCache fica pronto e aparece assim que ele visitar a Início
   (postRenderInicio já verifica ibgeHabAdvCache e renderiza na hora).
   Falhas aqui são sempre silenciosas para o usuário (sem popup/alerta) —
   quem quiser saber o motivo usa o link "por quê o IBGE não respondeu?"
   que já aparece junto ao indicador. --------------------------------- */
setTimeout(()=>{ refreshHabAdvData().catch(err=> console.warn('Atualização automática do IBGE falhou', err)); }, 1500);

})();

</script>
</body>
</html>
