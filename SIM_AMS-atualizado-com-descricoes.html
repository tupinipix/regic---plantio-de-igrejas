     must not silently take down the map for the user) -->

<style>
/* ============================================================
   SIM — Sistema de Inteligência Missionária — Design System
   ============================================================ */
:root{
  --navy:#0f2b3d;
  --navy-2:#123c54;
  --blue:#1b4965;
  --blue-light:#5fa8d3;
  --teal:#2a9d8f;
  --teal-light:#7fd1c6;
  --teal-bg:#e8f6f4;
  --gold-real:#e9c46a;
  --coral:#e76f51;
  --red:#d62839;
  --slate:#334155;
  --bg:#f4f7f8;
  --card:#ffffff;
  --border:#e3e9ec;
  --text:#16232b;
  --text-soft:#5c7080;
  --text-faint:#8a9aa5;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 1px 2px rgba(15,43,61,.06), 0 4px 16px rgba(15,43,61,.06);
  --shadow-lg:0 8px 30px rgba(15,43,61,.14);
  --header-h:58px;
  --sidebar-w:236px;
  --bottomnav-h:64px;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
h1,h2,h3,h4,p,ul,ol{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
img{max-width:100%;}
::selection{background:var(--teal-light);}

/* Scrollbars */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c6d2d8;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Loading splash ---------- */
#splash{
  position:fixed;inset:0;background:var(--navy);z-index:9999;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  color:#cfe3ea;transition:opacity .5s ease;
}
#splash .logo-mark{width:64px;height:64px;}
#splash .brand{font-weight:700;font-size:20px;letter-spacing:.5px;}
#splash .sub{font-size:12.5px;color:#7fa6b8;}
#splash.hide{opacity:0;pointer-events:none;}

/* ---------- Layout ---------- */
#appRoot{display:none;min-height:100%;}
#appRoot.ready{display:block;}

header.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:var(--navy);color:#fff;z-index:500;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  box-shadow:0 1px 0 rgba(255,255,255,.06);
}
.hamburger{
  display:none;background:none;border:none;color:#fff;width:38px;height:38px;
  border-radius:9px;align-items:center;justify-content:center;cursor:pointer;
}
.hamburger:hover{background:rgba(255,255,255,.08);}
.brandmark{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0;}
.brandmark .mk{width:30px;height:30px;flex:none;}
.brandmark .txt{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.brandmark .txt b{font-size:15.5px;letter-spacing:.3px;white-space:nowrap;}
.brandmark .txt span{font-size:10.5px;color:#9fc1cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{
  background:rgba(255,255,255,.08);border:none;color:#fff;width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,.18);}
.icon-btn svg{width:18px;height:18px;}

nav.sidebar{
  position:fixed;top:var(--header-h);bottom:0;left:0;width:var(--sidebar-w);
  background:var(--navy-2);overflow-y:auto;z-index:400;padding:14px 10px 90px;
  transition:transform .25s ease;
}
nav.sidebar .grp-label{
  color:#6d93a4;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;padding:14px 12px 6px;
}
nav.sidebar .grp-label:first-child{padding-top:4px;}
.navlink{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cfe3ea;
  text-decoration:none;font-size:13.6px;font-weight:500;cursor:pointer;margin-bottom:2px;
}
.navlink svg{width:17px;height:17px;flex:none;opacity:.85;}
.navlink:hover{background:rgba(255,255,255,.06);}
.navlink.active{background:var(--teal);color:#fff;}
.navlink.active svg{opacity:1;}
.navlink .badge-mini{
  margin-left:auto;background:rgba(255,255,255,.12);color:#fff;font-size:10.5px;
  padding:1px 7px;border-radius:20px;font-weight:700;
}
.navlink.active .badge-mini{background:rgba(255,255,255,.28);}

#sidebarScrim{
  position:fixed;inset:0;background:rgba(10,20,26,.5);z-index:390;display:none;
}

main.content{
  margin-left:var(--sidebar-w);padding-top:var(--header-h);min-height:100%;
}
.view-wrap{max-width:1280px;margin:0 auto;padding:20px 22px 60px;}

/* Bottom nav (mobile) */
nav.bottomnav{
  display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottomnav-h);
  background:#fff;border-top:1px solid var(--border);z-index:450;
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottomnav .bn-row{display:flex;height:64px;}
nav.bottomnav button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--text-soft);cursor:pointer;font-size:10.3px;font-weight:600;
}
nav.bottomnav button svg{width:20px;height:20px;}
nav.bottomnav button.active{color:var(--teal);}

/* ---------- Cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px;}

/* Chart.js canvases: without an explicit pixel height on the container, Chart.js's
   responsive mode falls back to an aspect-ratio guess (1:1 for doughnut/pie, 2:1 for
   bar/line) computed off the card's full width — on a wide card that balloons into a
   huge square canvas that wastes vertical space and can destabilize layout on mobile.
   Giving the wrapper a fixed height (and maintainAspectRatio:false in the chart options)
   makes Chart.js fill this box instead of inventing its own shape. */
.chart-box{position:relative;height:230px;}
.chart-box-sm{height:170px;}
@media(max-width:980px){ .chart-box{height:200px;} .chart-box-sm{height:160px;} }
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.section-title h2{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.2px;}
.section-title p{color:var(--text-soft);font-size:13px;margin-top:3px;}
.page-header{margin-bottom:20px;}
.page-header .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--teal);margin-bottom:5px;}
.page-header h1{font-size:25px;font-weight:800;color:var(--navy);letter-spacing:-.3px;}
.page-header .desc{color:var(--text-soft);font-size:13.7px;margin-top:6px;max-width:760px;}

.grid{display:grid;gap:14px;}
/* Grid items default to min-width:auto, so a wide table (or any wide content) forces the
   whole track — and everything after it — wider than the viewport instead of scrolling
   internally inside .table-wrap. This is what causes horizontal page overflow on mobile
   whenever a card containing a table sits in a grid. min-width:0 lets grid items shrink
   to their track's width so overflow-x:auto on .table-wrap can actually do its job. */
.grid > *{min-width:0;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(168px,1fr));}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2-1{grid-template-columns:2fr 1fr;}
@media(max-width:980px){.grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr;}}

.kpi{padding:15px 16px;position:relative;overflow:hidden;}
.kpi .lbl{font-size:11.3px;color:var(--text-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.kpi .val{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.5px;}
.kpi .sub{font-size:11.7px;color:var(--text-faint);margin-top:5px;}
.kpi .accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
.kpi .accent.teal{background:var(--teal);}
.kpi .accent.blue{background:var(--blue-light);}
.kpi .accent.gold{background:var(--gold-real);}
.kpi .accent.coral{background:var(--coral);}
.kpi .accent.red{background:var(--red);}
.kpi .accent.slate{background:var(--slate);}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2.5px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge.b-teal{background:var(--teal-bg);color:var(--teal);}
.badge.b-gold{background:#fdf3de;color:#a9761f;}
.badge.b-coral{background:#fdece6;color:var(--coral);}
.badge.b-red{background:#fbe4e6;color:var(--red);}
.badge.b-slate{background:#eef1f3;color:var(--slate);}
.badge.b-blue{background:#e8f1fa;color:var(--blue);}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;border:none;
  font-weight:700;font-size:13.3px;cursor:pointer;transition:.15s;
}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:#238c7f;}
.btn-ghost{background:#eef2f4;color:var(--slate);}
.btn-ghost:hover{background:#e3e9ec;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--slate);}
.btn-outline:hover{background:#f7f9fa;}
.btn-sm{padding:6px 11px;font-size:12.2px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

input[type=text],input[type=search],select,textarea{
  font-family:inherit;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13.6px;
  background:#fff;color:var(--text);outline:none;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue-light);box-shadow:0 0 0 3px rgba(95,168,211,.18);}
label.f-label{font-size:11.7px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px;}
.field{margin-bottom:12px;}

table{width:100%;border-collapse:collapse;font-size:13.3px;}
thead th{
  text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-soft);
  font-weight:700;padding:9px 12px;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--navy);}
thead th .arrow{opacity:.4;margin-left:3px;}
tbody td{padding:10px 12px;border-bottom:1px solid #edf1f3;vertical-align:middle;}
tbody tr:hover{background:#f8fafb;}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tbl-city-link{font-weight:700;color:var(--blue);cursor:pointer;}
.tbl-city-link:hover{text-decoration:underline;}

.pill-toggle{display:flex;background:#eef2f4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;}
.pill-toggle button{
  border:none;background:none;padding:7px 13px;border-radius:8px;font-size:12.6px;font-weight:700;
  color:var(--text-soft);cursor:pointer;
}
.pill-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1);}

.chip{
  display:inline-flex;align-items:center;gap:5px;background:#eef2f4;border:1px solid var(--border);
  padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;color:var(--slate);cursor:pointer;
}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.chips-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}

.empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}

.tag-info{
  background:var(--teal-bg);border:1px solid #cdeae5;border-radius:12px;padding:12px 14px;
  font-size:12.8px;color:#155e54;display:flex;gap:10px;
}
.tag-info svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--teal);}
.tag-warn{
  background:#fdf3de;border:1px solid #f5e1b0;color:#7a5a10;border-radius:12px;padding:12px 14px;
  font-size:12.8px;display:flex;gap:10px;
}
.tag-warn svg{width:17px;height:17px;flex:none;margin-top:1px;color:#c1861b;}

.modal-scrim{position:fixed;inset:0;background:rgba(10,20,26,.55);z-index:900;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-scrim.show{display:flex;}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;}
.modal-head h3{font-size:16px;font-weight:800;color:var(--navy);}
.modal-body{padding:18px;font-size:13.6px;color:var(--slate);}
.modal-body h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-soft);margin:14px 0 6px;}
.modal-body h4:first-child{margin-top:0;}
.modal-body code{background:#f0f4f5;padding:1px 6px;border-radius:5px;font-size:12px;}
.close-x{background:#f0f4f5;border:none;width:30px;height:30px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.priority-A{color:var(--red);}
.priority-B{color:var(--coral);}
.priority-C{color:#a9761f;}
.priority-D{color:var(--text-faint);}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;}
.dot-A{background:var(--red);}
.dot-B{background:var(--coral);}
.dot-C{background:var(--gold-real);}
.dot-D{background:#c3ccd1;}
.dot-igreja{background:var(--teal);}
.dot-grupo{background:var(--gold-real);}
.dot-sem{background:#d7dee2;}

/* map */
/* height:calc(100vh - header - 30px) alone assumes the map starts right below the topbar —
   it actually starts further down, after .page-header and the toolbar row, so that formula
   let the map overflow well past the bottom of the viewport. min(..., calc(100vh - Npx))
   caps it using a more realistic estimate of everything ABOVE it, with min-height as the
   floor on short viewports (the page just scrolls a little further in that case). */
#mapView{height:min(640px, calc(100vh - 270px));min-height:420px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}
.leaflet-popup-content{font-family:var(--font);font-size:12.8px;}
.map-legend{
  position:absolute;bottom:14px;left:14px;background:#fff;padding:10px 13px;border-radius:11px;
  box-shadow:var(--shadow);font-size:11.6px;z-index:410;max-width:200px;
}
.map-legend .lg-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.map-controls-panel{position:relative;}
.map-toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;
}

/* Assistant */
/* Same fix as #mapView above: account for .page-header + card padding sitting above this
   box instead of assuming it starts right under the topbar — otherwise the suggestion chips
   and the send button can end up below the fold, looking like clicks "don't do anything". */
/* Layout order (top to bottom): greeting (chat-intro, natural height, always visible) ->
   suggestion chips -> input row -> chat-log (the scrollable area where the actual
   question/answer exchange appears). Keeping the question field right under the greeting,
   with generated answers appearing below it, was a deliberate request — previously chat-log
   held everything and used flex:1, which stretched a single greeting bubble to fill the
   whole box and pushed the input far down with a big empty gap above it. */
.chat-wrap{display:flex;flex-direction:column;height:min(600px, calc(100vh - 260px));min-height:380px;}
.chat-intro{padding:6px 4px 0;}
.chat-log{flex:1;overflow-y:auto;padding:14px 4px 6px;margin-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;min-height:110px;}
.chat-log-empty{color:var(--text-faint);font-size:12.6px;font-style:italic;padding:8px 4px;}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:13.6px;line-height:1.55;}
.msg.bot{background:#fff;border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;}
.msg.user{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
.msg.bot .meta{font-size:10.8px;color:var(--text-faint);margin-top:8px;border-top:1px dashed var(--border);padding-top:7px;}
/* Single scrollable row instead of wrapping to multiple lines — with several example
   questions this could wrap to 3-4 rows on a narrow phone, alone eating a quarter of the
   whole chat box's height and squeezing the response area down to almost nothing. A
   horizontal strip keeps this compact and predictable at any width. */
.chat-suggestions{display:flex;flex-wrap:nowrap;gap:7px;padding:10px 4px;overflow-x:auto;flex:none;}
.chat-suggestions .chip{flex-shrink:0;white-space:nowrap;}
.chat-input-row{display:flex;gap:9px;padding-top:8px;border-top:1px solid var(--border);}

/* utility */
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-8{gap:8px;}
.gap-12{gap:12px;}
.mt-8{margin-top:8px;}
.mt-14{margin-top:14px;}
.mt-20{margin-top:20px;}
.text-soft{color:var(--text-soft);}
.text-faint{color:var(--text-faint);}
.text-sm{font-size:12.3px;}
.fw-700{font-weight:700;}
.w-full{width:100%;}
.hide-mobile{}
.hide-desktop{display:none;}
.divider{height:1px;background:var(--border);margin:14px 0;}

@media(max-width:980px){
  nav.sidebar{transform:translateX(-100%);}
  nav.sidebar.open{transform:translateX(0);}
  #sidebarScrim.show{display:block;}
  main.content{margin-left:0;padding-bottom:var(--bottomnav-h);}
  nav.bottomnav{display:block;}
  .hamburger{display:flex;}
  .hide-mobile{display:none !important;}
  .hide-desktop{display:block;}
  .view-wrap{padding:16px 14px 30px;}
  .grid-kpi{grid-template-columns:repeat(2,1fr);}
  .page-header h1{font-size:21px;}
  /* On mobile, the fixed bottom nav (var(--bottomnav-h), 64px) also covers part of the
     viewport, and the header/toolbar above these boxes takes a different amount of space
     than on desktop — so the desktop calc() constants above underestimate how much to
     subtract here, letting the chat input row / map sit partly behind the bottom nav
     (which is what made taps on them appear to do nothing). Override with mobile-measured
     constants and a lower min-height floor so short phones degrade to a bit of extra page
     scroll instead of hidden, unclickable content. */
  .chat-wrap{height:calc(100vh - 360px);min-height:280px;}
  #mapView{height:calc(100vh - 430px);min-height:220px;}
}
@media(min-width:981px){
  .sheet-scrim{display:none !important;}
}

/* bottom sheet (mobile "mais") */
.sheet-scrim{position:fixed;inset:0;background:rgba(10,20,26,.5);z-index:600;display:none;align-items:flex-end;}
.sheet-scrim.show{display:flex;}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:10px 8px 20px;max-height:75vh;overflow-y:auto;}
.sheet .grabber{width:36px;height:4px;background:#d7dee2;border-radius:4px;margin:6px auto 12px;}
.sheet .navlink{color:var(--slate);}
.sheet .navlink.active{background:var(--teal-bg);color:var(--teal);}
.sheet .navlink svg{opacity:.75;}

/* print */
@media print{
  header.topbar,nav.sidebar,nav.bottomnav,.no-print{display:none !important;}
  main.content{margin-left:0;padding-top:0;}
  body{background:#fff;}
  /* Triggered by the "Imprimir / PDF" button on the Simulador result — narrows the printout
     down to just the scenario card (form + page header are noise once you already have a
     result to export/print) via a class the button toggles right before window.print(). */
  body.print-sim-only .page-header, body.print-sim-only .sim-form-card{display:none !important;}
}

.footer-note{margin-top:34px;padding-top:16px;border-top:1px solid var(--border);color:var(--text-faint);font-size:11.6px;line-height:1.7;}

/* Collapsed-by-default, low-key disclosure — used for the methodology/citation table on the
   Sobre page so those references sit in the background instead of reading as a headline
   table of authors. */
.method-details summary{
  cursor:pointer;list-style:none;font-size:12.5px;font-weight:700;color:var(--text-soft);
  display:flex;align-items:center;gap:6px;
}
.method-details summary::-webkit-details-marker{display:none;}
.method-details summary::before{content:'›';display:inline-block;font-size:15px;line-height:1;color:var(--text-faint);transition:transform .15s;}
.method-details[open] summary::before{transform:rotate(90deg);}
.method-details[open] summary{margin-bottom:2px;}
.method-details table{font-size:12.2px;}
.method-details th{font-size:10px;}

.stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.stat-bar-row .lbl{width:150px;flex:none;font-size:12px;color:var(--slate);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-bar-track{flex:1;height:9px;background:#eef2f4;border-radius:6px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:6px;background:var(--teal);}
.stat-bar-val{width:64px;flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--navy);}

.profile-hero{
  background:linear-gradient(135deg,var(--navy) 0%, var(--blue) 100%);border-radius:var(--radius);
  padding:22px 24px;color:#fff;position:relative;overflow:hidden;
}
.profile-hero h2{font-size:23px;font-weight:800;}
.profile-hero .meta{color:#bcd6e2;font-size:13px;margin-top:5px;}
.profile-hero .badges{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}

.recommend-box{
  border-radius:12px;padding:15px 16px;border:1px solid;font-size:13.4px;line-height:1.6;
}

/* ---------- Glossário (siglas e termos do REGIC/IBGE) ----------
   Termo com sublinhado pontilhado: passe o mouse (desktop) ou toque/clique
   (mobile) para ver a explicação numa caixa flutuante. Um único elemento de
   dica é reaproveitado para todos os termos (ver seção 6-B do app.js). */
.gterm{border-bottom:1.5px dotted var(--text-faint);cursor:help;transition:color .12s,border-color .12s;}
.gterm:hover,.gterm:focus,.gterm.gt-active{color:var(--teal);border-bottom-color:var(--teal);outline:none;}
/* .profile-hero has a dark navy gradient background — the default dotted underline
   (var(--text-faint), a dark slate) would be nearly invisible against it. */
.profile-hero .gterm{border-bottom-color:rgba(255,255,255,.45);}
.profile-hero .gterm:hover,.profile-hero .gterm:focus,.profile-hero .gterm.gt-active{color:#fff;border-bottom-color:#7fd1c6;}
#gtermTip{
  position:fixed;z-index:1000;max-width:300px;background:#fff;color:var(--slate);
  border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);
  padding:12px 14px;font-size:12.6px;line-height:1.55;
  opacity:0;transform:translateY(4px) scale(.98);pointer-events:none;
  transition:opacity .12s ease,transform .12s ease;display:none;
}
#gtermTip.show{display:block;opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
#gtermTip .gt-term{font-weight:800;color:var(--navy);font-size:12.8px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
#gtermTip .gt-close{
  display:none;background:#f0f4f5;border:none;width:22px;height:22px;border-radius:7px;flex:none;
  align-items:center;justify-content:center;cursor:pointer;color:var(--text-soft);
}
#gtermTip .gt-close svg{width:12px;height:12px;}
@media(hover:none){
  #gtermTip .gt-close{display:flex;}
}
</style>

   "Serviço de Dados do IBGE" (servicodados.ibge.gov.br):

   1) API DE PESQUISAS (https://servicodados.ibge.gov.br/api/docs/pesquisas)
      — tentada PRIMEIRO, por ser a API indicada. Ela não expõe uma tabela
      fixa: é preciso descobrir em tempo real (a) qual "pesquisa" é a de
      Estimativas de População e (b) a posição do indicador populacional
      dentro dela, e só então buscar o resultado por município. Como a
      documentação pública não lista esses IDs, a descoberta é feita
      no próprio navegador do usuário a cada sessão; se qualquer etapa
      vier num formato inesperado, o código desiste dessa via sem erro
      visível e cai para a via 2 — nunca trata um resultado incerto como
      dado válido.
   2) API DE DADOS AGREGADOS / SIDRA (agregado 6579 "Estimativas de
      população residente", variável 9324) — usada como base confiável:
      é a mesma tabela oficial de estimativas populacionais do IBGE por
      município, com endpoint e parâmetros documentados e testados.

   As duas ficam sob o mesmo domínio (servicodados.ibge.gov.br) que o
   usuário indicou. Ambas dependem da conexão do navegador do usuário; se
   as duas falharem (offline, CORS, instabilidade), o app mostra
   claramente "IBGE indisponível" — nunca inventa nem reaproveita um
   valor antigo como se fosse atual (mesmo princípio dos gráficos/mapa).
   --------------------------------------------------------------------- */
const IBGE_PESQUISAS_BASE = 'https://servicodados.ibge.gov.br/api/v1/pesquisas';
const IBGE_AGREGADO_POPULACAO = 6579;
const IBGE_VARIAVEL_POPULACAO = 9324;
const IBGE_FETCH_TIMEOUT_MS = 9000;
const ibgePopCache = new Map(); // codmun -> {valor, ano, fonte} | 'error' (in-memory only; resets each session)

let IBGE_LAST_ERROR = null;   // {reason, detail, url} — last classified failure, for on-screen diagnostics
let IBGE_LAST_SOURCE = null;  // 'pesquisas' | 'agregados' — which API actually answered last time
let ibgePesquisaDiscovery = null; // Promise<{pesquisaId, posicao}|null> — resolved once per session

// Classifies a fetch failure so the UI/console can say something actionable instead of a
// generic "indisponível". Browsers report a CORS block and an offline/DNS/network failure
// identically (a TypeError with no useful detail) — we can't tell those apart from JS, so
// we name both possibilities rather than guessing one.
//
// `instanceof TypeError` alone is not reliable here: in some hosting contexts this page runs
// inside (an iframe/sandbox preview that relays fetch across a postMessage boundary — the
// same class of environment behind the DataCloneError fix, seção 4) the rejection that
// reaches this catch block can be a TypeError reconstructed in a different JS realm, whose
// prototype chain no longer satisfies `instanceof TypeError` even though `.name` and
// `.message` survive intact. Without this fallback, every one of those failures was
// silently miscategorized as "formato" (implying a response WAS received, just malformed)
// instead of "rede-ou-cors" (no response at all) — confusing when 100% of requests fail
// identically with "Failed to fetch", which is a connectivity/CORS symptom, not a format one.
function ibgeClassifyError(err){
  if(err && err.name === 'AbortError') return {reason:'timeout', detail:`sem resposta em ${IBGE_FETCH_TIMEOUT_MS/1000}s`};
  const msg = (err && err.message) || '';
  const pareceFalhaDeRede = (err instanceof TypeError) || (err && err.name === 'TypeError')
    || /failed to fetch|networkerror|load failed|network error|network request failed/i.test(msg);
  if(pareceFalhaDeRede) return {reason:'rede-ou-cors', detail:'a requisição falhou antes de obter resposta — rede indisponível, ou o servidor do IBGE bloqueou a origem (CORS)'};
  if(/^HTTP \d+/.test(msg)) return {reason:'http', detail:msg};
  return {reason:'formato', detail: msg || 'resposta em formato inesperado'};
}

// Timeout implementado via Promise.race, de propósito SEM usar AbortController/AbortSignal
// no fetch: em alguns ambientes de pré-visualização (iframe em sandbox que retransmite fetch
// via postMessage entre janelas), um AbortSignal no init do fetch não pode ser clonado e a
// própria chamada falha com "DataCloneError" antes de sair — o que aparecia disfarçado de
// erro "formato" do IBGE. O fetch em si não é cancelado ao expirar (fica em segundo plano),
// mas a Promise que a aplicação usa é resolvida/rejeitada no tempo certo do mesmo jeito.
function ibgeFetchJSON(url){
  let timeoutId;
  const timeout = new Promise((_, reject) => {
    timeoutId = setTimeout(() => {
      const err = new Error(`sem resposta em ${IBGE_FETCH_TIMEOUT_MS/1000}s`);
      err.name = 'AbortError';
      reject(err);
    }, IBGE_FETCH_TIMEOUT_MS);
  });
  const req = fetch(url).then(res => { if(!res.ok) throw new Error('HTTP '+res.status); return res.json(); });
  return Promise.race([req, timeout]).finally(()=> clearTimeout(timeoutId));
}

function normAccent(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

/* ---- Via 1: API de Pesquisas ------------------------------------------
   Descobre, em tempo real, a pesquisa "Estimativas de População" e a
   posição do seu indicador principal. Só é executada uma vez por sessão
   (o resultado — ou a desistência — fica em cache). */
function discoverPesquisaPopulacao(){
  if(ibgePesquisaDiscovery) return ibgePesquisaDiscovery;
  ibgePesquisaDiscovery = (async()=>{
    try{
      const lista = await ibgeFetchJSON(`${IBGE_PESQUISAS_BASE}?q=${encodeURIComponent('Estimativas de População')}`);
      if(!Array.isArray(lista) || !lista.length) return null;
      const alvo = lista.find(p=>{
        const nome = normAccent(p && (p.nome || p.pesquisa || ''));
        return nome.includes('estimativa') && nome.includes('populac');
      }) || lista[0];
      const pesquisaId = alvo && (alvo.id ?? alvo.pesquisa ?? alvo.codigo);
      if(pesquisaId === undefined || pesquisaId === null || pesquisaId === '') return null;
      // O indicador principal costuma estar na posição 1; confirmamos que a
      // posição responde antes de assumir que serve para buscar resultados.
      const posicao = 1;
      const teste = await ibgeFetchJSON(`${IBGE_PESQUISAS_BASE}/${pesquisaId}/indicadores/${posicao}`);
      if(!teste || (Array.isArray(teste) && !teste.length)) return null;
      return {pesquisaId, posicao};
    }catch(err){
      console.warn('IBGE (API de Pesquisas): descoberta da pesquisa de população falhou — seguindo para a API de Dados Agregados.', err);
      return null;
    }
  })();
  return ibgePesquisaDiscovery;
}

// Varre recursivamente o JSON de resultado procurando, para cada município
// pedido, um objeto "localidade" com o id correspondente e, perto dele, uma
// série/valor numérico plausível para população (>100 e <30 milhões). O
// formato exato da resposta desta API não está documentado publicamente,
// então a leitura é propositalmente defensiva: qualquer formato que não
// bata com esse padrão simplesmente não produz resultado (nunca um chute).
function parsePesquisasPopulacaoResponse(data, codmunsSet){
  const out = new Map();
  function pickValor(obj){
    if(obj == null) return null;
    if(typeof obj === 'number' && Number.isFinite(obj)) return obj;
    if(typeof obj === 'string'){
      const v = Number(obj.replace(/[^\d.-]/g,''));
      return Number.isFinite(v) ? v : null;
    }
    if(typeof obj === 'object'){
      const chaves = Object.keys(obj).filter(k=>/^\d{4}$/.test(k)).sort();
      if(chaves.length) return {valor: pickValor(obj[chaves[chaves.length-1]]), ano: chaves[chaves.length-1]};
      for(const k of Object.keys(obj)){ const r = pickValor(obj[k]); if(r!=null) return r; }
    }
    return null;
  }
  function walk(node){
    if(!node || typeof node !== 'object') return;
    if(Array.isArray(node)){ node.forEach(walk); return; }
    const loc = node.localidade;
    const cod = loc && String(loc.id);
    if(cod && codmunsSet.has(cod)){
      const fonte = node.series ?? node.res ?? node.serie ?? node.valores ?? node;
      const r = pickValor(fonte);
      if(r != null){
        const valor = (typeof r === 'object') ? r.valor : r;
        const ano = (typeof r === 'object') ? r.ano : null;
        if(Number.isFinite(valor) && valor > 100 && valor < 30000000) out.set(cod, {valor, ano, fonte:'pesquisas'});
      }
    }
    Object.keys(node).forEach(k=> walk(node[k]));
  }
  walk(data);
  return out;
}

async function fetchPopulacaoViaPesquisas(codmuns){
  const disc = await discoverPesquisaPopulacao();
  if(!disc) return {map:new Map(), url:null};
  const url = `${IBGE_PESQUISAS_BASE}/${disc.pesquisaId}/indicadores/${disc.posicao}/resultados/${codmuns.join('|')}`;
  const data = await ibgeFetchJSON(url);
  const map = parsePesquisasPopulacaoResponse(data, new Set(codmuns.map(String)));
  return {map, url};
}

/* ---- Via 2: API de Dados Agregados / SIDRA (fallback confiável) ------- */
// Parses the IBGE Agregados API response shape:
// [{ id, variavel, unidade, resultados:[{ series:[{ localidade:{id,nome}, serie:{"2022":"12345"} }] }] }]
// Returns a Map keyed by codmun (string) -> {valor:Number, ano:string}. Silently skips entries
// that don't parse as a finite number — a malformed/unexpected row must never surface as data.
function parseIbgePopulacaoResponse(data){
  const out = new Map();
  const series = data && data[0] && data[0].resultados && data[0].resultados[0] && data[0].resultados[0].series;
  if(!Array.isArray(series)) return out;
  series.forEach(s=>{
    const cod = s && s.localidade && String(s.localidade.id);
    const serie = s && s.serie;
    if(!cod || !serie) return;
    const anos = Object.keys(serie).filter(a=>/^\d{4}$/.test(a)).sort();
    if(!anos.length) return;
    const ano = anos[anos.length-1];
    const valor = Number(String(serie[ano]).replace(/[^\d.-]/g,''));
    if(Number.isFinite(valor) && valor>0) out.set(cod, {valor, ano, fonte:'agregados'});
  });
  return out;
}

function ibgePopulacaoURL(codmuns){
  return `https://servicodados.ibge.gov.br/api/v3/agregados/${IBGE_AGREGADO_POPULACAO}/periodos/-1/variaveis/${IBGE_VARIAVEL_POPULACAO}?localidades=N6[${codmuns.join('|')}]`;
}

/* ---- Orquestração: tenta a API de Pesquisas, cai para Agregados ------- */
// Single município — used by the Perfil do Município / Simulador screens.
function fetchPopulacaoIBGE(codmun){
  if(ibgePopCache.has(codmun)){
    const cached = ibgePopCache.get(codmun);
    // Uma consulta anterior (única ou em lote) pode ter deixado o sentinela 'error' no
    // cache para este código — uma string, portanto truthy. Sem esta normalização, quem
    // chama fetchPopulacaoIBGE (Perfil do Município, Simulador) recebia essa string como
    // se fosse um resultado válido, tentava ler `.valor` dela (undefined) e renderizava
    // "—"/"NaN%" em vez da mensagem de "IBGE indisponível" — bug real, não só teórico:
    // acontece sempre que a 1ª tentativa falha e o usuário revisita o mesmo município
    // (ou visita o Simulador depois da Busca, ou vice-versa) na mesma sessão, já que o
    // cache nunca expira. Uma Promise em andamento é repassada como está; o sentinela
    // 'error' e qualquer outro valor não-Promise que não seja um objeto de resultado
    // válido (deve ter `.valor`) viram null, igual a uma tentativa nova que falhou.
    if(cached instanceof Promise) return cached;
    return Promise.resolve((cached && typeof cached === 'object' && 'valor' in cached) ? cached : null);
  }
  const p = (async()=>{
    try{
      const {map, url} = await fetchPopulacaoViaPesquisas([codmun]);
      const hit = map.get(String(codmun));
      if(hit){ IBGE_LAST_SOURCE = 'pesquisas'; ibgePopCache.set(codmun, hit); return hit; }
    }catch(err){ console.warn('IBGE (API de Pesquisas) indisponível, tentando Dados Agregados.', err); }
    const url = ibgePopulacaoURL([codmun]);
    try{
      const data = await ibgeFetchJSON(url);
      const map = parseIbgePopulacaoResponse(data);
      const r = map.get(String(codmun)) || null;
      if(!r){ IBGE_LAST_ERROR = {reason:'formato', detail:'resposta recebida mas sem o município esperado', url}; console.warn('IBGE: resposta sem o município esperado', url, data); ibgePopCache.set(codmun, 'error'); return null; }
      IBGE_LAST_SOURCE = 'agregados';
      ibgePopCache.set(codmun, r);
      return r;
    }catch(err){
      IBGE_LAST_ERROR = Object.assign({url}, ibgeClassifyError(err));
      console.warn('IBGE população indisponível para', codmun, '·', IBGE_LAST_ERROR.reason, '·', IBGE_LAST_ERROR.detail, '· url testada:', url, err);
      ibgePopCache.set(codmun, 'error');
      return null;
    }
  })();
  ibgePopCache.set(codmun, p);
  return p;
}

// Batch, chunked (the Agregados API accepts multiple N6 codes separated by "|"; requests are
// kept small and run with limited concurrency to be a good citizen of a public government API).
async function fetchPopulacaoIBGEBatch(codmuns, onProgress){
  const CHUNK = 40, CONCURRENCY = 4;
  const toFetch = codmuns.filter(c=> !(ibgePopCache.get(c) && !(ibgePopCache.get(c) instanceof Promise) && ibgePopCache.get(c) !== 'error'));
  let done = 0;

  // Tentativa via API de Pesquisas, em lotes pequenos (uma URL com todos os ~300
  // municípios do campo de uma vez correria risco de ficar longa demais para o
  // servidor aceitar) — o que ela conseguir resolver não precisa passar pela API de
  // Dados Agregados depois.
  const pesquisasChunks = [];
  for(let i=0;i<toFetch.length;i+=CHUNK) pesquisasChunks.push(toFetch.slice(i,i+CHUNK));
  async function runPesquisasChunk(chunk){
    try{
      const {map} = await fetchPopulacaoViaPesquisas(chunk);
      if(map.size){ IBGE_LAST_SOURCE = 'pesquisas'; map.forEach((v,cod)=> ibgePopCache.set(cod, v)); }
    }catch(err){ console.warn('IBGE (API de Pesquisas) indisponível para um lote, seguindo com Dados Agregados.', err); }
  }
  {
    let pIdx = 0;
    async function pWorker(){ while(pIdx < pesquisasChunks.length){ const c = pesquisasChunks[pIdx++]; await runPesquisasChunk(c); } }
    await Promise.all(Array.from({length:Math.min(CONCURRENCY, pesquisasChunks.length)}, pWorker));
  }

  const restantes = toFetch.filter(c=> !(ibgePopCache.get(c) && ibgePopCache.get(c) !== 'error' && !(ibgePopCache.get(c) instanceof Promise)));
  done = toFetch.length - restantes.length;
  if(onProgress) onProgress(done, toFetch.length);

  const chunks = [];
  for(let i=0;i<restantes.length;i+=CHUNK) chunks.push(restantes.slice(i,i+CHUNK));
  // A API de Dados Agregados do IBGE, na prática (confirmado ao vivo por um usuário nesta
  // sessão — não é hipotético), às vezes devolve HTTP 500 para um lote inteiro de até 40
  // códigos quando só UM deles é o problema (código sem dado disponível para este
  // agregado/variável, ou algum outro caso de borda da própria API). Sem tratamento, isso
  // descartava o lote inteiro — até 39 municípios bons perdidos por causa de 1 ruim. Em vez
  // de aceitar isso, um lote que falha (por HTTP/rede, ou que volta "200 OK" mas vazio) é
  // dividido ao meio e cada metade tentada separadamente, recursivamente, até isolar
  // exatamente qual código(s) individual(is) falha(m) — só esse(s) fica(m) marcado(s) como
  // 'error'; o resto do lote original é recuperado normalmente. Bisecção é sequencial (uma
  // metade de cada vez, não em paralelo) para não multiplicar a concorrência contra uma API
  // pública além do limite (CONCURRENCY) já combinado para os lotes de primeiro nível.
  async function runChunk(chunk){
    const url = ibgePopulacaoURL(chunk);
    try{
      const data = await ibgeFetchJSON(url);
      const map = parseIbgePopulacaoResponse(data);
      if(map.size === chunk.length){
        IBGE_LAST_SOURCE = 'agregados';
        chunk.forEach(cod=> ibgePopCache.set(cod, map.get(String(cod))));
        done += chunk.length;
        if(onProgress) onProgress(done, toFetch.length);
        return;
      }
      if(map.size > 0 || chunk.length === 1){
        // resposta parcial, ou já é o menor lote possível — não compensa bisectar mais.
        if(map.size) IBGE_LAST_SOURCE = 'agregados';
        else { IBGE_LAST_ERROR = {reason:'formato', detail:'resposta recebida mas vazia/sem municípios reconhecidos', url}; console.warn('IBGE lote: resposta sem dados reconhecíveis', url, data); }
        chunk.forEach(cod=> ibgePopCache.set(cod, map.get(String(cod)) || 'error'));
        done += chunk.length;
        if(onProgress) onProgress(done, toFetch.length);
        return;
      }
      // "200 OK" mas nenhum código do lote veio, e ainda dá para dividir — vale tentar
      // isolar, em vez de já desistir do lote inteiro.
      console.warn(`IBGE: lote de ${chunk.length} município(s) voltou sem dados reconhecíveis — isolando em lotes menores...`, url);
      await bisectChunk(chunk);
    }catch(err){
      if(chunk.length === 1){
        IBGE_LAST_ERROR = Object.assign({url}, ibgeClassifyError(err));
        console.warn('IBGE indisponível para o município', chunk[0], '·', IBGE_LAST_ERROR.reason, '·', IBGE_LAST_ERROR.detail, '· url testada:', url, err);
        ibgePopCache.set(chunk[0], 'error');
        done += 1;
        if(onProgress) onProgress(done, toFetch.length);
        return;
      }
      console.warn(`IBGE: lote de ${chunk.length} município(s) falhou (${(err && err.message) || err}) — isolando em lotes menores...`, url);
      await bisectChunk(chunk);
    }
  }
  async function bisectChunk(chunk){
    const mid = Math.ceil(chunk.length/2);
    await runChunk(chunk.slice(0,mid));
    await runChunk(chunk.slice(mid));
  }
  let idx = 0;
  async function worker(){ while(idx < chunks.length){ const c = chunks[idx++]; await runChunk(c); } }
  await Promise.all(Array.from({length:Math.min(CONCURRENCY, chunks.length)}, worker));
  const result = new Map();
  codmuns.forEach(cod=>{
    const c = ibgePopCache.get(cod);
    if(c && c !== 'error' && !(c instanceof Promise)) result.set(cod, c);
  });
  return result;
}

// Builds the small "algo deu errado — teste você mesmo" diagnostic block shown wherever a
// population fetch fails. Includes a direct link to the exact URL that was tried, opened in
// a new tab — this bypasses fetch()/CORS entirely (a plain navigation always works if the
// endpoint itself is reachable), so it tells the user in one click whether the problem is the
// API address/parameters or something blocking the fetch from inside the page.
function ibgeDiagnosticHTML(){
  const e = IBGE_LAST_ERROR;
  if(!e) return 'IBGE indisponível no momento — verifique a conexão com a internet e tente novamente.';
  const reasonTxt = {
    'rede-ou-cors': 'a página não conseguiu completar a requisição (sem internet, ou o navegador bloqueou por política de origem — CORS)',
    'timeout': 'o IBGE não respondeu a tempo',
    'http': `o IBGE respondeu com erro (${esc(e.detail)})`,
    'formato': `a resposta não veio no formato esperado (${esc(e.detail)})`,
  }[e.reason] || esc(e.detail||'motivo desconhecido');
  // Caso mais comum na prática: o arquivo foi aberto direto do disco (file://) em vez de
  // servido por http(s). Nesse caso o navegador manda "Origin: null" para o IBGE — muitos
  // servidores (e o próprio Chrome, em vários casos) tratam isso como não-confiável e
  // bloqueiam o fetch, mesmo com internet normal e mesmo a API sendo pública. É a causa mais
  // provável quando TODAS as consultas falham de forma idêntica com "Failed to fetch" — sem
  // isso, o usuário só vê "sem internet, ou CORS" e não tem como saber qual dos dois é, nem
  // o que fazer a respeito (link de teste em nova aba não ajuda aqui: uma navegação normal
  // não é bloqueada por CORS, então ele "funciona" mesmo quando o fetch da página não vai).
  const fileHint = (typeof location !== 'undefined' && location.protocol === 'file:')
    ? `<div class="mt-8" style="font-weight:600">Este arquivo está aberto direto do disco (file://) — essa é a causa mais comum deste erro. Navegadores costumam bloquear a busca ao IBGE quando a página não vem de um servidor http(s), mesmo com internet normal. Para resolver: sirva o arquivo por um servidor local — por exemplo, abra um terminal na pasta onde está o SIM_AMS.html e rode <code>python3 -m http.server</code>, depois acesse <code>http://localhost:8000/SIM_AMS.html</code> no navegador — ou hospede o arquivo em qualquer servidor web (inclusive um servidor interno da AMS).</div>`
    : '';
  return `Tentamos a API de Pesquisas e a API de Dados Agregados do IBGE (ambas em servicodados.ibge.gov.br) e nenhuma respondeu: ${reasonTxt}. <a href="${esc(e.url)}" target="_blank" rel="noopener" style="font-weight:700">Testar este link do IBGE em uma nova aba →</a> <span class="text-faint">(se abrir com números, o endereço está correto — mesmo assim pode não funcionar aqui dentro da página, veja a nota abaixo se você abriu o arquivo direto do disco)</span>${fileHint}`;
}

// Pequeno selo de fonte, usado ao lado de um valor de população que deu certo — deixa claro
// qual das duas APIs do IBGE respondeu desta vez (a API de Pesquisas pode não estar sempre
// disponível para todo indicador; quando isso acontece, o app usa a de Dados Agregados sem
// que o usuário precise fazer nada, mas fica registrado qual delas foi usada).
function ibgeFonteLabel(fonte){
  return fonte === 'pesquisas' ? 'API de Pesquisas/IBGE' : 'API de Dados Agregados (SIDRA)/IBGE';
}

/* ---------------------------------------------------------------------
   1. HELPERS
   --------------------------------------------------------------------- */
const fmt = n => (n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toLocaleString('pt-BR');
const fmt1 = n => (n===null||n===undefined||isNaN(n)) ? "—" : Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1});
const pct = (a,b) => (!b) ? 0 : Math.round((a/b)*1000)/10;
const esc = s => (s===null||s===undefined) ? "" : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){
  if(!s) return "";
  return String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
}
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }

/* ---------------------------------------------------------------------
   2-B. GLOSSÁRIO — siglas, conceitos e termos do REGIC/IBGE explicados ao
   passar o mouse ou tocar/clicar no termo. A maioria de quem usa este app
   não é especialista em REGIC, então qualquer sigla ou termo técnico que
   apareça na tela (badges de hierarquia e prioridade, cabeçalhos de
   tabela, títulos de índice etc.) deve poder ser explicado sem sair da
   tela — ver G() e o motor de dica em initGlossaryTooltip() (seção 21).

// Envolve `label` num span clicável/focável que o motor de dica (initGlossaryTooltip)
// reconhece — se a chave não existir no glossário, devolve o texto normal (escapado)
// em vez de quebrar a tela.
function G(key, label){
  if(!GLOSSARY[key]) return esc(label);
  return `<span class="gterm" data-g="${esc(key)}" tabindex="0">${esc(label)}</span>`;
}

  "Presença consolidada": {label:"Presença consolidada", cls:"b-teal", dot:"dot-igreja"},

const HIER_GKEY = {
  "Metrópole":"metropole", "Capital Regional":"capitalregional", "Centro Sub-Regional":"centrosubregional",
  "Centro de Zona":"centrodezona", "Centro Local":"centrolocal",
};
function statusBadge(status){
  const s = STATUS_LABEL[status] || {label:status, cls:"b-slate"};
  return `<span class="badge ${s.cls}"><span class="dot ${s.dot||''}"></span>${esc(s.label)}</span>`;
}
function prioridadeBadge(p){
  if(!p) return `<span class="badge b-slate">—</span>`;
  const s = PRIORIDADE_LABEL[p];
  return `<span class="badge ${s.cls}"><span class="dot dot-${p}"></span>${G('prioridade_'+p.toLowerCase(), s.short)}</span>`;
}
function hierBadge(m){
  if(!m.hier_label) return '<span class="badge b-slate">—</span>';
  const gkey = HIER_GKEY[m.hier_label];
  const label = gkey ? G(gkey, m.hier_label) : esc(m.hier_label);
  return `<span class="badge b-blue">${label}${m.hier_nivel?` (${m.hier_nivel==1?'1':m.hier_nivel})`:''}</span>`;
}

/* ---------------------------------------------------------------------
   4. ROUTER
   --------------------------------------------------------------------- */
const state = { route:"inicio", params:{}, mapInstance:null, mapLayer:null };

function parseHash(){
  let h = location.hash.replace(/^#\/?/, "");
  if(!h) h = "inicio";
  const [route, qstr] = h.split("?");
  const params = {};
  if(qstr){ qstr.split("&").forEach(pair=>{ const [k,v] = pair.split("="); params[decodeURIComponent(k)] = decodeURIComponent(v||""); }); }
  return {route: route || "inicio", params};
}
function navigate(route, params){
  let hash = "#/"+route;
  if(params && Object.keys(params).length){
    hash += "?" + Object.entries(params).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("&");
  }
  if(location.hash === hash){ render(); } else { location.hash = hash; }
}
window.addEventListener('hashchange', render);

function buildSidebar(){
  const nav = qs('#sidebarNav');
  let html = "";
  NAV.forEach(g=>{
    html += `<div class="grp-label">${esc(g.grp)}</div>`;
    g.items.forEach(it=>{
      html += `<a class="navlink" data-nav="${it.id}">${it.icon}<span>${esc(it.label)}</span></a>`;
    });
  });
  nav.innerHTML = html;
  nav.addEventListener('click', e=>{
    const a = e.target.closest('[data-nav]');
    if(!a) return;
    navigate(a.getAttribute('data-nav'));
    closeSidebar();
  });
}
function buildBottomNav(){
  const row = qs('#bottomNavRow');
  const map = {inicio:{label:"Início",icon:ICON.home}, mapa:{label:"Mapa",icon:ICON.map}, vazios:{label:"Vazios",icon:ICON.gap}, busca:{label:"Buscar",icon:ICON.search}, mais:{label:"Mais",icon:ICON.more}};
  row.innerHTML = BOTTOM_NAV_IDS.map(id=>`<button data-bn="${id}">${map[id].icon}<span>${map[id].label}</span></button>`).join("");
  row.addEventListener('click', e=>{
    const b = e.target.closest('[data-bn]');
    if(!b) return;
    const id = b.getAttribute('data-bn');
    if(id === 'mais'){ openSheet(); } else { navigate(id); }
  });
}
function openSidebar(){ qs('#sidebarNav').classList.add('open'); qs('#sidebarScrim').classList.add('show'); }
function closeSidebar(){ qs('#sidebarNav').classList.remove('open'); qs('#sidebarScrim').classList.remove('show'); }
function openSheet(){
  const c = qs('#sheetContent');
  let html = `<div class="grabber"></div>`;
  NAV.forEach(g=>{
    html += `<div class="grp-label">${esc(g.grp)}</div>`;
    g.items.forEach(it=>{ html += `<a class="navlink" data-nav="${it.id}">${it.icon}<span>${esc(it.label)}</span></a>`; });
  });
  c.innerHTML = html;
  qs('#sheetScrim').classList.add('show');
}
function closeSheet(){ qs('#sheetScrim').classList.remove('show'); }

function updateActiveNav(route){
  qsa('[data-nav]').forEach(a=> a.classList.toggle('active', a.getAttribute('data-nav')===route));
  qsa('[data-bn]').forEach(b=>{
    const id = b.getAttribute('data-bn');
    const active = (id===route) || (id==='mais' && !BOTTOM_NAV_IDS.includes(route));
    b.classList.toggle('active', active);
  });
}

function recommendFor(m){
  // returns {level, title, text}
  if(m.status === "Presença consolidada"){
    if(m.n_grupos>0 || (m.regic_dependentes_sem_presenca||0)>=3){
      return {level:"teal", title:"Fortalecer polo e apoiar irradiação",
        text:`${m.municipio} já possui presença consolidada (${m.n_igrejas} igreja(s), ${fmt(m.membros)} membros). ` +
             (m.regic_dependentes_sem_presenca ? `Como referência REGIC para ${m.regic_dependentes_sem_presenca} município(s) ainda sem presença, recomenda-se avaliar abertura de frentes missionárias a partir deste polo.` : `Recomenda-se acompanhar a maturidade dos grupos e avaliar potencial de multiplicação.`)};
    }
    return {level:"teal", title:"Consolidar e monitorar",
      text:`${m.municipio} possui presença organizada. Recomenda-se monitoramento de saúde missionária e apoio ao discipulado contínuo.`};
  }
  if(m.status === "Presença frágil (grupo)"){
    return {level:"gold", title:"Avaliar organização do grupo",
      text:`${m.municipio} possui grupo(s) em formação (${m.n_grupos}), ainda sem igreja organizada. Recomenda-se avaliar prontidão para organização e fortalecer liderança local.`};
  }
  // sem presença
  if(!m.no_escopo_ams){
    return {level:"slate", title:"Fora do escopo territorial desta base",
      text:`${m.municipio} não integra a rede de municípios já influenciada pela presença atual da AMS nesta base (pertence a outra região de influência REGIC, fora dos polos com presença adventista aqui cadastrados). Este sistema não avalia prioridade missionária para territórios de outros campos administrativos.`};
  }
  const p = m.prioridade;
  if(p === "A") return {level:"red", title:"Estudar e avaliar abertura de frente missionária",
    text:`${m.municipio} apresenta alta centralidade territorial (${m.hier_label}) e ausência de presença organizada, dentro da rede que a AMS já influencia. Recomenda-se estudo missionário complementar e avaliação de abertura de uma frente missionária, com apoio do polo ${m.polo_nome||"regional"}.`};
  if(p === "B") return {level:"coral", title:"Avaliar visita exploratória e criação de PG",
    text:`${m.municipio} é Centro de Zona sem presença adventista. Recomenda-se visita exploratória e avaliação de criação de Pequeno Grupo, articulado ao polo ${m.polo_nome||"regional"}.`};
  if(p === "C") return {level:"gold", title:"Expandir a partir do polo já coberto",
    text:`${m.municipio} integra o arranjo populacional do polo ${m.polo_nome}, que já possui presença adventista. Recomenda-se avaliar expansão orgânica a partir das congregações existentes no polo.`};
  return {level:"slate", title:"Não priorizar no momento",
    text:`${m.municipio} é um Centro Local de menor centralidade territorial. Não há indicação de prioridade imediata; recomenda-se revisão periódica quando novos dados estiverem disponíveis.`};
}

// or a corporate/ad-blocker filter blocks the CDN, the app must degrade gracefully instead
// of throwing and leaving the whole view (or splash screen) stuck.
function libMissingNotice(container, libLabel){
  if(!container) return;
  container.outerHTML = `<div class="empty-state">${ICON.info}<div>${esc(libLabel)} não pôde ser carregado (verifique a conexão com a internet — este recurso depende de uma biblioteca externa via CDN).</div></div>`;
}
function makeChart(canvasId, config){
  const canvas = qs('#'+canvasId);
  if(typeof Chart === 'undefined'){ libMissingNotice(canvas, 'O gráfico'); return null; }
  try{ return new Chart(canvas, config); }
  catch(err){ console.error('Chart error', canvasId, err); libMissingNotice(canvas, 'O gráfico'); return null; }
}

// "Habitantes por adventista" — soma a população estimada (IBGE, tempo real) de todos os
// municípios do escopo AMS e divide pelo total de membros da base eclesiástica. Desde que o
// app carrega, uma atualização automática roda em segundo plano (ver "Atualização automática
// do IBGE" na seção 21) — o botão abaixo continua disponível para forçar uma nova consulta a
// qualquer momento, sem esperar o próximo carregamento da página.
let ibgeHabAdvCache = null; // {totalPop, respondidos, total, fontes, atualizadoEm} — em memória, válido para a sessão
let ibgeHabAdvInFlight = null; // Promise em andamento — evita disparar duas consultas em paralelo
function renderHabAdvResult(){
  const valEl = qs('#habAdvVal'), accentEl = qs('#habAdvAccent'), btn = qs('#btnCalcPop');
  if(!valEl || !ibgeHabAdvCache) return;
  const {totalPop, respondidos, total, fontes, atualizadoEm} = ibgeHabAdvCache;
  const habPorAdv = (SUMMARY.membros_total && totalPop) ? Math.round(totalPop / SUMMARY.membros_total) : null;
  const habPorAdvFreq = (SUMMARY.membros_frequentes_oficial && totalPop) ? Math.round(totalPop / SUMMARY.membros_frequentes_oficial) : null;
  valEl.textContent = habPorAdv ? fmt(habPorAdv) : '—';
  if(accentEl) accentEl.className = 'accent ' + (habPorAdv ? 'teal' : 'slate');
  if(btn){
    btn.disabled = false;
    btn.textContent = respondidos < total
      ? `↻ Recalcular (IBGE respondeu ${respondidos}/${total} municípios)`
      : `↻ Recalcular (IBGE, tempo real)`;
  }
  const diagWrap = qs('#habAdvDiag');
  if(diagWrap){
    if(respondidos === 0){
      diagWrap.innerHTML = `<a href="javascript:void(0)" data-ibge-diag style="font-weight:700;font-size:10.3px">por quê o IBGE não respondeu?</a>`;
      bindIbgeDiagLink();
    } else {
      const nPesq = fontes ? fontes.pesquisas : 0, nAgr = fontes ? fontes.agregados : 0;
      const partes = [];
      if(nPesq) partes.push(`${nPesq} via API de Pesquisas`);
      if(nAgr) partes.push(`${nAgr} via API de Dados Agregados`);
      if(atualizadoEm) partes.push(`atualizado às ${esc(atualizadoEm)}`);
      const freqLine = habPorAdvFreq ? `<div class="mt-8">Considerando apenas os ${fmt(SUMMARY.membros_frequentes_oficial)} membros <b>frequentes</b> (fonte: Secretaria AMS): <b>1 para cada ${fmt(habPorAdvFreq)} habitantes</b>.</div>` : '';
      diagWrap.innerHTML = (partes.length ? `<span class="text-faint">${esc(partes.join(' · '))}</span>` : '') + freqLine;
    }
  }
}
// Núcleo independente da UI: busca e grava o resultado em ibgeHabAdvCache. Chamado tanto
// automaticamente (no carregamento do app) quanto pelo botão "Recalcular" — o botão só
// acrescenta o feedback visual (texto "Consultando…", progresso, disabled).
async function refreshHabAdvData(onProgress){
  if(ibgeHabAdvInFlight) return ibgeHabAdvInFlight; // já em andamento — reaproveita, não duplica
  const codmuns = MUNI.filter(m=>m.no_escopo_ams).map(m=>m.codmun);
  ibgeHabAdvInFlight = (async()=>{
    const map = await fetchPopulacaoIBGEBatch(codmuns, onProgress);
    const totalPop = Array.from(map.values()).reduce((s,r)=>s+r.valor,0);
    const fontes = {pesquisas:0, agregados:0};
    map.forEach(r=>{ if(r.fonte==='pesquisas') fontes.pesquisas++; else fontes.agregados++; });
    const atualizadoEm = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    ibgeHabAdvCache = {totalPop, respondidos: map.size, total: codmuns.length, fontes, atualizadoEm};
    renderHabAdvResult();
    return ibgeHabAdvCache;
  })();
  try{ return await ibgeHabAdvInFlight; } finally { ibgeHabAdvInFlight = null; }
}
async function runHabAdvCalculation(){
  const btn = qs('#btnCalcPop');
  if(!btn) return;
  const total = MUNI.filter(m=>m.no_escopo_ams).length;
  btn.disabled = true;
  btn.textContent = `Consultando IBGE… 0/${total}`;
  await refreshHabAdvData((done,tot)=>{
    const b = qs('#btnCalcPop'); if(b) b.textContent = `Consultando IBGE… ${done}/${tot}`;
  });
}

  `;
}

function postRenderMapa(){
  const mapEl = qs('#mapView');
  if(typeof L === 'undefined'){
    libMissingNotice(mapEl, 'O mapa interativo');
    const legend = qs('.map-legend'); if(legend) legend.style.display = 'none';
    return;
  }
  const map = L.map(mapEl, {zoomControl:true}).setView([-21.3, -44.5], 7.1);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom:18, subdomains:'abcd'
  }).addTo(map);
  state.mapInstance = map;

  const cluster = (typeof L.markerClusterGroup === 'function')
    ? L.markerClusterGroup({maxClusterRadius:42, spiderfyOnMaxZoom:true})
    : L.layerGroup(); // graceful fallback if the marker-cluster plugin failed to load
  let currentType = "todos", currentRegion = "";

  function radiusFor(membros){ return Math.max(5, Math.min(26, Math.sqrt(membros||1)*1.7)); }

  function buildMarkers(){
    cluster.clearLayers();
    let count = 0;
    CHURCHES.forEach(c=>{
      if(!c.coord_valida) return; // invalid/placeholder coordinates can't be plotted — see Qualidade dos Dados
      if(currentType!=="todos" && c.tipo!==currentType) return;
      if(currentRegion && c.regiao_pastoral!==currentRegion) return;
      count++;
      const color = c.tipo==='Igreja' ? '#2a9d8f' : '#e9c46a';
      const m = L.circleMarker([c.lat, c.lon], {
        radius: radiusFor(c.membros), color:'#0f2b3d', weight:1, fillColor:color, fillOpacity:.82
      });
      const muni = MUNI_BY_KEY[c.cidade_key];
      const sats = muni ? (muni.regic_dependentes_sem_presenca||0) : 0;
      m.bindPopup(`
        <div style="min-width:190px">
          <div style="font-weight:800;color:#0f2b3d;font-size:13.5px">${esc(c.nome)}</div>
          <div style="color:#5c7080;font-size:11.8px;margin:2px 0 8px">${esc(c.tipo)} · ${esc(c.cidade||'')} · ${esc(c.distrito||'')}</div>
          <div style="font-size:12.3px;line-height:1.6">
            <b>${fmt(c.membros)}</b> membros<br>
            ${sats ? `<b>${sats}</b> município(s) satélite sem presença` : `Sem dependentes REGIC diretos sem presença`}
          </div>
          <button style="margin-top:9px;background:#2a9d8f;color:#fff;border:none;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer" onclick="window.__simGoto('${esc(c.cidade_key||'')}')">Ver perfil do município</button>
        </div>`);
      cluster.addLayer(m);
    });
    map.addLayer(cluster);
    qs('#mapCount').textContent = `${count} congregações exibidas`;
  }
  buildMarkers();

  qs('#mapTypeToggle').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    qsa('#mapTypeToggle button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); currentType = b.getAttribute('data-t');
    buildMarkers();
  });
  qs('#mapRegionFilter').addEventListener('change', e=>{ currentRegion = e.target.value; buildMarkers(); });
}

   referência — não uma prescrição rígida — por isso runSimulation()

function runSimulation(){
  const key = qs('#simMuni').value;
  const acao = qs('#simAcao').value;
  const horizonte = qs('#simHorizonte button.active').getAttribute('data-h');
  const m = MUNI_BY_KEY[key];
  if(!m){ return; }
  const satAtual = m.regic_dependentes_sem_presenca || 0;
  const satTotal = m.regic_dependentes_total || 0;
  // transparent, documented projection factor by horizon & action type (not population-based — flagged)
  const actionFactor = {
    "Estudo missionário complementar":0.05, "Visita exploratória":0.10, "Criação de PG":0.30,
    "Formação de centros de influência adventista":0.40, "Abertura de frente missionária":0.45,
    "Reforço de polo existente":0.55, "Formação do núcleo base para plantio de Igreja":0.70
  }[acao] || 0.2;
  const horizonFactor = {1:0.4, 3:0.75, 5:1}[horizonte];
  const projectedNewCoverage = Math.round(satAtual * actionFactor * horizonFactor);
  const reducaoVazio = satAtual ? Math.round((projectedNewCoverage/satAtual)*100) : 0;
  const before = m.status;
  const rec = recommendFor(m);

  qs('#simResult').innerHTML = `

        <div class="text-soft text-sm mt-8">${satAtual} município(s) satélite REGIC ainda sem presença</div>
      </div>
      <div class="card card-pad" style="background:var(--teal-bg)">
        <div class="lbl" style="font-size:11px;font-weight:700;text-transform:uppercase;color:#0d564d">Cenário projetado (${horizonte} ano${horizonte>1?'s':''})</div>
        <div class="mt-8"><span class="badge b-teal">Presença fortalecida / iniciada</span></div>
        <div class="text-sm mt-8" style="color:#0d564d">Até <b>${projectedNewCoverage}</b> município(s) satélite com maior chance de receber ação missionária a partir deste polo (${reducaoVazio}% dos ${satAtual} dependentes atuais).</div>
        <div class="text-sm mt-8" style="color:#0d564d">Continuidade territorial: ${m.hier_label||'—'} passa a ${before==='Sem presença'?'ganhar':'reforçar'} presença adventista organizada.</div>
      </div>
    </div>
    <div class="tag-info" id="simPopBox">${ICON.info}<div id="simPopText">Consultando população do IBGE em tempo real…</div></div>
    <div class="divider"></div>
    ${recommendBox(rec)}
    ${actionPlaybookHTML(acao)}
    <p class="text-faint text-sm mt-14">Metodologia: fator de ação (peso conforme intensidade da intervenção) × fator de horizonte (velocidade esperada de maturação), aplicado sobre o nº de municípios satélites REGIC ainda sem presença. É uma projeção qualitativa de apoio à decisão — não uma previsão estatística validada. <b>Algoritmos não substituem liderança.</b></p>
  `;
  qs('#simPrintBtn').addEventListener('click', ()=>{
    document.body.classList.add('print-sim-only');
    window.print();
  });

}

let activeSimCodmun = null;
async function loadSimuladorPopulacao(m){
  activeSimCodmun = m.codmun;
  const r = await fetchPopulacaoIBGE(m.codmun);
  if(activeSimCodmun !== m.codmun) return; // outro cenário já foi simulado enquanto aguardávamos
  const textEl = qs('#simPopText'), boxEl = qs('#simPopBox');
  if(!textEl) return; // usuário navegou para outra tela
  if(r){
    textEl.innerHTML = `<b>População do município (IBGE, tempo real):</b> ${fmt(r.valor)} habitantes (estimativa ${esc(r.ano||'mais recente')} · ${esc(ibgeFonteLabel(r.fonte))}). A cobertura populacional somada dos municípios satélites ainda não é calculada nesta versão — requer consulta individual por município satélite.`;
  } else {
    textEl.innerHTML = `<b>População (IBGE):</b> ${ibgeDiagnosticHTML()}`;
    if(boxEl){ boxEl.classList.remove('tag-info'); boxEl.classList.add('tag-warn'); }
  }
}

function postRenderBusca(params){
  const input = qs('#buscaInput');
  const suggestBox = qs('#buscaSuggest');
  function doSearch(q){
    q = norm(q);
    if(!q){ suggestBox.style.display='none'; return; }
    const matches = MUNI.filter(m=>norm(m.municipio).includes(q) || m.codmun.includes(q)).slice(0,10);
    if(!matches.length){ suggestBox.innerHTML = `<div class="card-pad text-faint text-sm">Nenhum município encontrado.</div>`; suggestBox.style.display='block'; return; }
    suggestBox.innerHTML = matches.map(m=>`<div class="navlink" style="color:var(--slate);border-radius:0" data-pick="${esc(m.municipio_key)}">
      <span style="flex:1">${esc(m.municipio)}</span>${statusBadge(m.status)}</div>`).join('');
    suggestBox.style.display='block';
  }
  input.addEventListener('input', debounce(e=>doSearch(e.target.value),140));
  input.addEventListener('focus', e=>{ if(e.target.value) doSearch(e.target.value); });
  // (outside-click dismissal for the suggestion box is handled by a single delegated
  // listener registered once at init — see section 21 — to avoid stacking listeners)
  suggestBox.addEventListener('click', e=>{
    const d = e.target.closest('[data-pick]'); if(!d) return;
    const key = d.getAttribute('data-pick');
    suggestBox.style.display='none';
    input.value = MUNI_BY_KEY[key].municipio;
    navigate('busca',{m:key});
  });
  qsa('[data-example]').forEach(c=>c.addEventListener('click', ()=>{
    const m = MUNI.find(x=>x.municipio===c.getAttribute('data-example'));
    if(m) navigate('busca',{m:m.municipio_key});
  }));

  const hashParams = parseHash().params;
  if(hashParams.m && MUNI_BY_KEY[hashParams.m]){
    const m = MUNI_BY_KEY[hashParams.m];
    qs('#perfilContainer').innerHTML = renderPerfilMunicipio(m);
    loadMunicipioPopulacao(m);
  }
}

// Fetches live population for the município currently shown in #perfilContainer and fills
// in the "População (IBGE)" KPI card. Guards against the classic async race: if the user
// navigates to a different município (or away entirely) before the request resolves, the
// stale response is discarded instead of overwriting the wrong profile.
let activeProfileCodmun = null;
async function loadMunicipioPopulacao(m){
  activeProfileCodmun = m.codmun;
  const r = await fetchPopulacaoIBGE(m.codmun);
  if(activeProfileCodmun !== m.codmun) return; // user moved on — discard
  const valEl = qs('#popVal'), subEl = qs('#popSub'), accentEl = qs('#popAccent');
  const habValEl = qs('#habLocalVal'), habSubEl = qs('#habLocalSub'), habAccentEl = qs('#habLocalAccent');
  if(!valEl) return; // view changed underneath us
  if(r){
    valEl.textContent = fmt(r.valor);
    subEl.innerHTML = `estimativa IBGE ${esc(r.ano||'mais recente')} <span class="text-faint">· ${esc(ibgeFonteLabel(r.fonte))}, tempo real</span>`;
    if(accentEl) accentEl.className = 'accent teal';
    // Razão local membros × habitantes — é este cálculo, por município, que faltava no
    // app: até então "Membros" e "População (IBGE)" apareciam lado a lado como dois
    // números soltos, sem a relação entre eles ser de fato calculada em lugar nenhum da
    // tela. Municípios sem nenhum membro cadastrado não têm razão "habitantes por
    // membro" (divisão por zero) — mostrar isso explicitamente em vez de um número
    // enganoso ou um traço mudo é o comportamento correto aqui.
    if(habValEl){
      if(m.membros > 0){
        const razao = Math.round(r.valor / m.membros);
        const pctAdv = (m.membros / r.valor) * 100;
        habValEl.textContent = fmt(razao);
        habSubEl.innerHTML = `1 membro adventista para cada ${fmt(razao)} habitantes <span class="text-faint">(${pctAdv < 0.01 ? '<0,01' : pctAdv.toFixed(pctAdv<0.1?3:2)}% da população)</span>`;
        if(habAccentEl) habAccentEl.className = 'accent teal';
      } else {
        habValEl.textContent = '—';
        habSubEl.innerHTML = `<span class="text-faint">sem membros cadastrados neste município — razão não se aplica</span>`;
        if(habAccentEl) habAccentEl.className = 'accent red';
      }
    }
  } else {
    valEl.textContent = '—';
    subEl.innerHTML = `IBGE indisponível · <a href="javascript:void(0)" data-ibge-diag style="font-weight:700">por quê?</a>`;
    bindIbgeDiagLink();
    if(habValEl){
      habValEl.textContent = '—';
      habSubEl.innerHTML = `<span class="text-faint">depende da população do IBGE, indisponível no momento</span>`;
      if(habAccentEl) habAccentEl.className = 'accent slate';
    }
  }
}

// Renders the "Polo de referência" cell in the Perfil do Município. O campo polo_nome vem
// direto do REGIC 2018 e nem sempre é um município desta base: pode ser (a) uma cidade fora
// de Minas Gerais (influência interestadual do REGIC — ex.: "Vitória da Conquista", "Brasília")
// ou (b) um "Arranjo Populacional" — um agrupamento de municípios, não um único município.
// Nesses dois casos NÃO existe um perfil correspondente para abrir na base MG desta AMS, então
// o nome não pode ser um link clicável — antes disso acontecia (norm(polo_nome) virava um
// data-goto-muni que nunca resolvia), e o clique não fazia nada, sem aviso ao usuário.
function poloRefHTML(m){
  if(!m.polo_nome) return '—';
  const key = norm(m.polo_nome);
  const existe = !!MUNI_BY_KEY[key];
  if(existe){
    return `<span class="tbl-city-link" data-goto-muni="${esc(key)}">${esc(m.polo_nome)}</span>${m.polo_tem_presenca?' <span class="badge b-teal" style="margin-left:6px">tem presença</span>':' <span class="badge b-slate" style="margin-left:6px">sem presença</span>'}`;
  }
  const ehArranjo = /^arranjo populacional/i.test(m.polo_nome);
  const nota = ehArranjo
    ? 'agrupamento de municípios (REGIC), sem perfil individual nesta base'
    : 'fora de Minas Gerais — influência interestadual do REGIC, sem perfil nesta base';
  return `${esc(m.polo_nome)} <span class="badge b-slate" style="margin-left:6px" title="${esc(nota)}">${esc(nota)}</span>`;
}

function assistantAnswer(qRaw){
  const q = norm(qRaw);
  const src = `<div class="meta">Fonte: base eclesiástica AMS + REGIC 2018 (IBGE) · dados desta sessão · não substitui discernimento espiritual e decisão da liderança.</div>`;

  if(/10 municip|prioritari|top ?10|ranking/.test(q) && !/compar/.test(q)){
    const top = MUNI.filter(m=>m.prioridade).sort((a,b)=>b.prioridade_score-a.prioridade_score).slice(0,10);
    return `<b>Os 10 municípios de maior prioridade territorial nesta base são:</b><ol style="margin:8px 0 0 18px;padding:0">${top.map(m=>`<li>${esc(m.municipio)} — ${esc(m.hier_label)}, polo ${esc(m.polo_nome||'—')} (${PRIORIDADE_LABEL[m.prioridade].short})</li>`).join('')}</ol>${src}`;
  }
  if(/importantes.*(nao|não).*presenca|sem presenca.*importante|capital regional|centro sub/.test(q)){
    const list = MUNI.filter(m=>m.no_escopo_ams && m.status==='Sem presença' && (m.hier_nivel||5)<=3);
    return `<b>${list.length} município(s) de alta centralidade (Capital Regional ou Centro Sub-Regional) ainda sem presença adventista, dentro da rede já influenciada pela AMS:</b><ul style="margin:8px 0 0 18px;padding:0">${list.slice(0,12).map(m=>`<li>${esc(m.municipio)} (${esc(m.hier_label)}) — polo: ${esc(m.polo_nome||'—')}</li>`).join('')}</ul>${src}`;
  }
  if(/polo.*(irradia|potencial)|maior potencial de irradia/.test(q)){
    const top = POLOS.slice().sort((a,b)=>b.n_satelites-a.n_satelites)[0];
    return `<b>${esc(top.municipio)}</b> é o polo com maior potencial de irradiação identificado: ${top.n_satelites} município(s) satélite ainda sem presença dependem dele segundo o REGIC 2018, com ${top.n_igrejas} igreja(s) e ${fmt(top.membros)} membros já organizados. Classificação: ${esc(top.tipologia)}.${src}`;
  }
  if(/onde.*(iniciar|criar).*pg|estrategic.*pg/.test(q)){
    const list = MUNI.filter(m=>m.prioridade==='B' || m.prioridade==='C').sort((a,b)=>b.prioridade_score-a.prioridade_score).slice(0,6);
    return `<b>Municípios com melhor indicação para início de um Pequeno Grupo (dependência de polo já coberto ou centralidade intermediária):</b><ul style="margin:8px 0 0 18px;padding:0">${list.map(m=>`<li>${esc(m.municipio)} — ${prioridadeBadge(m.prioridade)}</li>`).join('')}</ul>${src}`;
  }
  if(/grupos?.*proxim.*(etapa|organiza)|prontos? para organiza/.test(q)){
    const list = CHURCHES.filter(c=>c.tipo==='Grupo' && c.membros>=45).sort((a,b)=>b.membros-a.membros).slice(0,8);
    return `<b>Grupos com maior proxy de maturidade (60+ ou 45+ membros, mais próximos de uma possível organização):</b><ul style="margin:8px 0 0 18px;padding:0">${list.map(c=>`<li>${esc(c.nome)} (${esc(c.cidade||'—')}) — ${fmt(c.membros)} membros</li>`).join('')}</ul><p class="text-faint text-sm" style="margin-top:6px">Nota: prontidão real para organização depende de critérios adicionais (frequência, liderança, tempo) não presentes nesta base — este é apenas um proxy por tamanho.</p>${src}`;
  }
  if(/compar/.test(q)){
    const names = MUNI.filter(m=> q.includes(norm(m.municipio)) ).slice(0,2);
    if(names.length===2){
      const [a,b] = names;
      return `<b>${esc(a.municipio)} vs ${esc(b.municipio)}</b>
        <table style="margin-top:8px;width:100%"><tbody>
        <tr><td class="text-soft">Hierarquia</td><td class="fw-700">${esc(a.hier_label)}</td><td class="fw-700">${esc(b.hier_label)}</td></tr>
        <tr><td class="text-soft">Igrejas</td><td>${a.n_igrejas}</td><td>${b.n_igrejas}</td></tr>
        <tr><td class="text-soft">Grupos</td><td>${a.n_grupos}</td><td>${b.n_grupos}</td></tr>
        <tr><td class="text-soft">Membros</td><td>${fmt(a.membros)}</td><td>${fmt(b.membros)}</td></tr>
        <tr><td class="text-soft">Satélites sem presença</td><td>${a.regic_dependentes_sem_presenca||0}</td><td>${b.regic_dependentes_sem_presenca||0}</td></tr>
        </tbody></table>${src}`;
    }
    return `Para comparar, cite dois nomes de municípios exatamente como aparecem na base — por exemplo: "Compare Pouso Alegre e Varginha".${src}`;
  }
  if(/dados.*pesquisar|precisamos pesquisar|dados.*faltam|dados.*ausentes/.test(q)){
    return `<b>Dados ainda não integrados nesta base, recomendados antes de decisões finais:</b><ul style="margin:8px 0 0 18px;padding:0">
      <li>População por município: já disponível em tempo real (API do IBGE, ver Perfil do Município e "Habitantes por adventista" na Início) — ainda falta incorporá-la como peso na fórmula do IPMT</li>
      <li>Distância real / tempo de deslocamento até o polo (malha viária)</li>
      <li>Indicadores educacionais (INEP) e de saúde (CNES/DATASUS)</li>
      <li>Geocodificação de 4 registros eclesiásticos pendentes (ver tela "Qualidade dos Dados")</li>
      <li>Dados de frequência, liderança e tempo de organização dos grupos, para a Tela 5</li>
      </ul>${src}`;
  }
  // fallback: try to detect a single município name for a mini-profile
  const found = MUNI.filter(m=>q.includes(norm(m.municipio))).sort((a,b)=>b.municipio.length-a.municipio.length)[0];
  if(found){
    const rec = recommendFor(found);
    return `<b>${esc(found.municipio)}</b> — ${statusBadge(found.status)} · ${esc(found.hier_label||'—')}<br>
      ${found.n_igrejas} igreja(s), ${found.n_grupos} grupo(s), ${fmt(found.membros)} membros. Polo: ${esc(found.polo_nome||'—')}.
      <div class="mt-8">${recommendBox(rec)}</div>
      <button class="btn btn-ghost btn-sm mt-8" onclick="window.__simGoto('${esc(found.municipio_key)}')">Ver perfil completo →</button>${src}`;
  }
  return `Não encontrei essa informação específica nesta base. Posso responder sobre: ranking de prioridades, municípios sem presença por hierarquia, potencial de irradiação de polos, indicação para novos PGs, grupos próximos de organização, comparação entre dois municípios, ou lacunas de dados. Tente reformular ou use um dos exemplos abaixo.${src}`;
}

function postRenderAssistente(){
  const log = qs('#chatLog');
  function push(role, html){
    const empty = qs('#chatLogEmpty'); if(empty) empty.remove();
    const d = document.createElement('div'); d.className = 'msg '+role; d.innerHTML = html;
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  function ask(text){
    if(!text.trim()) return;
    // The suggestion chips are only useful before the first question — once the
    // conversation starts, they'd otherwise keep eating most of the box's height
    // (especially on mobile, where 6 wrapped chips can take 250px+), crushing the
    // response area down to almost nothing. Hiding them frees that space for answers.
    const sugg = qs('#chatSuggestions'); if(sugg) sugg.style.display = 'none';
    push('user', esc(text));
    setTimeout(()=> push('bot', assistantAnswer(text)), 220);
    qs('#chatInput').value = '';
  }
  qs('#chatSend').addEventListener('click', ()=>ask(qs('#chatInput').value));
  qs('#chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') ask(e.target.value); });
  qs('#chatSuggestions').addEventListener('click', e=>{
    const c = e.target.closest('[data-ask]'); if(!c) return;
    ask(c.getAttribute('data-ask'));
  });
}

function render(){
  const {route, params} = parseHash();
  state.route = route; state.params = params;
  const view = VIEWS[route] || VIEWS.inicio;
  destroyCharts();
  hideGlossaryTip(); // a tela inteira é substituída abaixo — não deixar uma dica "grudada" num termo que não existe mais
  if(state.mapInstance){ try{ state.mapInstance.remove(); }catch(e){} state.mapInstance = null; }
  try{
    qs('#viewWrap').innerHTML = view.render(params);
  }catch(err){
    console.error('Erro ao montar a tela', route, err);
    qs('#viewWrap').innerHTML = `<div class="empty-state">${ICON.info}<div>Não foi possível carregar esta tela. Tente novamente ou volte ao início.</div></div>`;
  }
  if(view.post){
    try{ view.post(params); }
    catch(err){ console.error('Erro ao inicializar a tela', route, err); }
  }
  updateActiveNav(route);
  bindGlobalDelegates();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}

function bindGlobalDelegates(){
  // Scoped to #viewWrap only — the static shell (sidebar, bottomnav, brandmark, sheet)
  // is bound once at init time to avoid stacking duplicate listeners on every render().
  const root = qs('#viewWrap');
  qsa('[data-goto-muni]', root).forEach(elx=>{
    elx.addEventListener('click', ()=> navigate('busca', {m: elx.getAttribute('data-goto-muni')}));

    elx.addEventListener('click', ()=>{
      const key = norm(elx.getAttribute('data-goto-name'));
      if(MUNI_BY_KEY[key]) navigate('busca', {m:key});
    });
  });
  qsa('[data-nav]', root).forEach(elx=>{
    elx.addEventListener('click', ()=> navigate(elx.getAttribute('data-nav')));
  });
}
